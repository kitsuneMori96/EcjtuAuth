name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AuinEcjtuWifi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "AuinEcjtuWifi-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AuinEcjtuWifi-windows-zip
          path: AuinEcjtuWifi-windows-x64.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v t="$TAG" 'index($0, "## " t)==1 {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "未在 CHANGELOG.md 找到 $TAG 段落，请先补充更新说明" >&2
            exit 1
          fi
          cat release_notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename APK
        run: mv artifacts/AuinEcjtuWifi-android-apk/app-release.apk AuinEcjtuWifi-android.apk

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: true
          files: |
            AuinEcjtuWifi-android.apk
            artifacts/AuinEcjtuWifi-windows-zip/AuinEcjtuWifi-windows-x64.zip
